<script>
// ============================================

const PURIM_SYMBOLS = [

    { emoji: '📜', label: 'מגילה' },

    { emoji: '🎂', label: 'עוגת יום הולדת' },
    { emoji: '🥂', label: 'לחיים' },
    { emoji: '🪻', label: 'פרח' },
    { emoji: '🦚', label: 'טווס' },
    { emoji: '🐒', label: 'קוף' },
    { emoji: '🧞', label: 'שד' },
    { emoji: '🎠', label: 'קרוסלה' },
    { emoji: '🏅', label: 'מדליה' },
];

// ============================================
// CARD GENERATION - Projective Plane of order 7
// Each card has 8 symbols, every pair shares exactly 1 symbol
// Total: 57 symbols, 57 cards
// ============================================
function generateProjectivePlane(n) {
    const cards = [];

    // Line at infinity: points n^2, n^2+1, ..., n^2+n
    const infinityCard = [];
    for (let i = 0; i <= n; i++) {
        infinityCard.push(n * n + i);
    }
    cards.push(infinityCard);

    // For each slope m = 0,1,...,n-1:
    //   For each intercept b = 0,1,...,n-1:
    //     Card = { point_at_infinity[m], (x, (m*x+b) mod n) for x=0..n-1 }
    for (let m = 0; m < n; m++) {
        for (let b = 0; b < n; b++) {
            const card = [n * n + m];
            for (let x = 0; x < n; x++) {
                const y = (m * x + b) % n;
                card.push(x * n + y);
            }
            cards.push(card);
        }
    }

    // Vertical lines (slope = infinity):
    //   For each x = 0,1,...,n-1:
    //     Card = { point_at_infinity[n], (x,0), (x,1), ..., (x,n-1) }
    for (let x = 0; x < n; x++) {
        const card = [n * n + n];
        for (let y = 0; y < n; y++) {
            card.push(x * n + y);
        }
        cards.push(card);
    }

    return cards;
}

function verifyCards(cards) {
    for (let i = 0; i < cards.length; i++) {
        for (let j = i + 1; j < cards.length; j++) {
            const common = cards[i].filter(s => cards[j].includes(s));
            if (common.length !== 1) {
                console.error(`Cards ${i} and ${j} share ${common.length} symbols:`, common);
                return false;
            }
        }
    }
    console.log(`All ${cards.length} cards verified! Every pair shares exactly 1 symbol.`);
    return true;
}

const allCards = generateProjectivePlane(7);
verifyCards(allCards);

// ============================================
// GAME STATE
// ============================================
let state = {
    screen: 'start',
    players: ['', ''],
    currentPlayerIndex: 0,
    scores: [],
    round: 0,
    totalRounds: 10,
    streak: 0,
    bestStreak: 0,
    card1: null,
    card2: null,
    selectedOnCard1: null,
    selectedOnCard2: null,
    usedPairs: new Set(),
    message: '',
    messageType: '',
    mixedSizes: false,
    shuffledSymbols: null,
    card1Sizes: [],
    card2Sizes: [],
};

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

const rotClasses = ['rot-1', 'rot-2', 'rot-3', 'rot-4', 'rot-5', 'rot-6', 'rot-7', ''];

// Generate random size assignments for a card of 8 items
// Returns array of 'size-large' or 'size-small' with ~3 large and ~5 small
function generateSizeAssignments(count) {
    const sizes = [];
    const numLarge = 3; // 3 large, 5 small
    const indices = [];
    for (let i = 0; i < count; i++) indices.push(i);
    const shuffled = shuffleArray(indices);
    for (let i = 0; i < count; i++) {
        sizes.push(shuffled.indexOf(i) < numLarge ? 'size-large' : 'size-small');
    }
    return sizes;
}

function getRandomPair() {
    const indices = [];
    for (let i = 0; i < allCards.length; i++) indices.push(i);

    let attempts = 0;
    while (attempts < 1000) {
        const shuffled = shuffleArray(indices);
        const i = shuffled[0];
        const j = shuffled[1];
        const key = `${Math.min(i,j)}-${Math.max(i,j)}`;
        if (!state.usedPairs.has(key)) {
            state.usedPairs.add(key);
            return [i, j];
        }
        attempts++;
    }
    state.usedPairs.clear();
    return [indices[0], indices[1]];
}

function getCommonSymbol(card1, card2) {
    return card1.find(s => card2.includes(s));
}

function startGame() {
    state.scores = state.players.map(() => 0);
    state.currentPlayerIndex = 0;
    state.round = 0;
    state.totalRounds = 10;
    state.streak = 0;
    state.bestStreak = 0;
    state.usedPairs.clear();
    state.message = '';
    state.messageType = '';

    const symbolIndices = [];
    for (let i = 0; i < 57; i++) symbolIndices.push(i);
    state.shuffledSymbols = shuffleArray(symbolIndices);

    state.screen = 'playing';
    nextRound();
}

function nextRound() {
    state.round++;

    const [i, j] = getRandomPair();
    state.card1 = shuffleArray(allCards[i]);
    state.card2 = shuffleArray(allCards[j]);
    state.selectedOnCard1 = null;
    state.selectedOnCard2 = null;
    state.message = `סיבוב ${state.round} - תור של ${state.players[state.currentPlayerIndex]}`;
    state.messageType = 'info';

    state.card1Sizes = generateSizeAssignments(8);
    state.card2Sizes = generateSizeAssignments(8);

    render();
}

function selectSymbol(cardNum, symbolIndex) {
    if (cardNum === 1) {
        state.selectedOnCard1 = symbolIndex;
    } else {
        state.selectedOnCard2 = symbolIndex;
    }

    if (state.selectedOnCard1 !== null && state.selectedOnCard2 !== null) {
        checkAnswer();
    }

    render();
}

function checkAnswer() {
    const sym1 = state.card1[state.selectedOnCard1];
    const sym2 = state.card2[state.selectedOnCard2];
    const commonSym = getCommonSymbol(state.card1, state.card2);
    const playerName = state.players[state.currentPlayerIndex];

    if (sym1 === sym2 && sym1 === commonSym) {
        state.streak++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;

        let points = 10 + state.streak * 2;
        state.scores[state.currentPlayerIndex] += points;

        state.message = `🎉 ${playerName} - נכון! +${points} נקודות`;
        state.messageType = 'correct';

        showConfetti();
        render();
        state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
        setTimeout(nextRound, 1200);
    } else {
        state.streak = 0;
        state.message = `❌ ${playerName} - לא נכון, נסו שוב!`;
        state.messageType = 'wrong';
        state.selectedOnCard1 = null;
        state.selectedOnCard2 = null;
        render();
    }
}

function endGame() {
    state.screen = 'end';
    showConfetti();
    render();
}

function showConfetti() {
    const container = document.getElementById('confettiContainer');
    const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#764ba2', '#ff9a9e', '#a18cd1'];

    for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = (Math.random() * 10 + 5) + 'px';
        confetti.style.height = (Math.random() * 10 + 5) + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        confetti.style.animation = `confetti-fall ${Math.random() * 2 + 1.5}s linear ${Math.random() * 0.5}s forwards`;
        container.appendChild(confetti);
    }

    setTimeout(() => {
        container.innerHTML = '';
    }, 3000);
}

// ============================================
// RENDER
// ============================================
function render() {
    const app = document.getElementById('app');

    if (state.screen === 'start') {
        app.innerHTML = renderStartScreen();
    } else if (state.screen === 'playing') {
        app.innerHTML = renderPlayingScreen();
    } else if (state.screen === 'end') {
        app.innerHTML = renderEndScreen();
    }

    bindEvents();
}

function getSymbol(cardSymbolIndex) {
    const mappedIndex = state.shuffledSymbols[cardSymbolIndex];
    return PURIM_SYMBOLS[mappedIndex % PURIM_SYMBOLS.length];
}

function renderStartScreen() {
    const playersHtml = state.players.map((name, i) => `
        <div class="player-input-row">
            <input type="text" class="player-name-input" data-index="${i}"
                   placeholder="שם שחקן/ית ${i + 1}" value="${name}">
            ${state.players.length > 2 ? `<button class="remove-player" data-index="${i}">✕</button>` : ''}
        </div>
    `).join('');

    return `
        <div class="start-screen">
            <h2>🎭 ברוכים הבאים לחידון פורים! 🎭</h2>
            <div class="players-form">
                <h3>הכניסו את שמות השחקנים:</h3>
                ${playersHtml}
                <button class="add-player-btn" id="addPlayerBtn">+ הוסיפו שחקן/ית</button>
            </div>
            <br>
            <button class="btn" id="startBtn">🎉 התחילו לשחק!</button>
        </div>
    `;
}

function renderPlayingScreen() {
    const renderCard = (card, cardNum, selected, sizeAssignments) => {
        const itemsHtml = card.map((sym, idx) => {
            const s = getSymbol(sym);
            const rot = rotClasses[idx % rotClasses.length];
            const sizeClass = state.mixedSizes ? sizeAssignments[idx] : '';
            const selectedClass = selected === idx ? 'selected' : '';
            return `
                <div class="card-item ${rot} ${sizeClass} ${selectedClass}"
                     data-card="${cardNum}" data-idx="${idx}">
                    <div class="emoji">${s.emoji}</div>
                    <div class="label">${s.label}</div>
                </div>
            `;
        }).join('');

        const label = cardNum === 1 ? 'כרטיס א\'' : 'כרטיס ב\'';
        const mixedClass = state.mixedSizes ? 'mixed-sizes' : '';
        return `
            <div class="card ${mixedClass}">
                <div class="card-label">${label}</div>
                ${itemsHtml}
            </div>
        `;
    };

    const scoresHtml = state.players.map((name, i) => {
        const isCurrent = i === state.currentPlayerIndex;
        return `<div class="stat" style="${isCurrent ? 'border: 2px solid #ffd700;' : ''}">${name}: <span>${state.scores[i]}</span></div>`;
    }).join('');

    return `
        <div class="current-player-banner">🎯 תור של ${state.players[state.currentPlayerIndex]}</div>
        <div class="stats-bar">
            ${scoresHtml}
            <div class="stat">סיבוב: <span>${state.round}</span></div>
        </div>
        <div class="message">
            <div class="message-text ${state.messageType}">${state.message}</div>
        </div>
        <div class="game-area">
            ${renderCard(state.card1, 1, state.selectedOnCard1, state.card1Sizes)}
            ${renderCard(state.card2, 2, state.selectedOnCard2, state.card2Sizes)}
        </div>
        <div style="text-align:center; margin-top: 10px;">
            <button class="btn small" id="endGameBtn">🏁 סיימו משחק</button>
        </div>
    `;
}

function renderEndScreen() {
    const sorted = state.players.map((name, i) => ({ name, score: state.scores[i] }))
        .sort((a, b) => b.score - a.score);

    const winner = sorted[0];
    const isTie = sorted.length > 1 && sorted[0].score === sorted[1].score;

    const scoresListHtml = sorted.map((p, i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '⭐';
        return `<p style="font-size: 1.3em; margin: 8px 0;">${medal} ${p.name}: <span style="color: #ffd700; font-weight: 900;">${p.score}</span> נקודות</p>`;
    }).join('');

    const winnerMsg = isTie ? '🤝 תיקו!' : `🏆 ${winner.name} ניצח/ה!`;

    return `
        <div class="end-screen">
            <h2>🎭 המשחק הסתיים! 🎭</h2>
            <div class="final-score" style="font-size: 2em;">${winnerMsg}</div>
            <div style="margin: 20px 0;">
                <h3 style="color: #ffd700; margin-bottom: 10px;">תוצאות:</h3>
                ${scoresListHtml}
            </div>
            <p style="opacity: 0.8;">סה"כ ${state.round} סיבובים | רצף הכי ארוך: ${state.bestStreak} 🔥</p>
            <br>
            <button class="btn" id="playAgainBtn">🔄 שחקו שוב</button>
        </div>
    `;
}

function bindEvents() {
    const startBtn = document.getElementById('startBtn');
    if (startBtn) {
        startBtn.addEventListener('click', () => {
            // Read player names from inputs
            document.querySelectorAll('.player-name-input').forEach(input => {
                const idx = parseInt(input.dataset.index);
                state.players[idx] = input.value.trim();
            });
            // Validate: all names must be filled
            const emptyNames = state.players.some(n => n === '');
            if (emptyNames) {
                alert('נא למלא את שמות כל השחקנים!');
                return;
            }
            startGame();
        });
    }

    const addPlayerBtn = document.getElementById('addPlayerBtn');
    if (addPlayerBtn) {
        addPlayerBtn.addEventListener('click', () => {
            // Save current input values before re-render
            document.querySelectorAll('.player-name-input').forEach(input => {
                const idx = parseInt(input.dataset.index);
                state.players[idx] = input.value;
            });
            state.players.push('');
            render();
        });
    }

    document.querySelectorAll('.remove-player').forEach(btn => {
        btn.addEventListener('click', () => {
            // Save current input values before re-render
            document.querySelectorAll('.player-name-input').forEach(input => {
                const idx = parseInt(input.dataset.index);
                state.players[idx] = input.value;
            });
            const idx = parseInt(btn.dataset.index);
            state.players.splice(idx, 1);
            render();
        });
    });

    document.querySelectorAll('.card-item').forEach(item => {
        item.addEventListener('click', () => {
            const cardNum = parseInt(item.dataset.card);
            const idx = parseInt(item.dataset.idx);
            selectSymbol(cardNum, idx);
        });
    });

    const endGameBtn = document.getElementById('endGameBtn');
    if (endGameBtn) {
        endGameBtn.addEventListener('click', () => {
            endGame();
        });
    }

    const playAgainBtn = document.getElementById('playAgainBtn');
    if (playAgainBtn) {
        playAgainBtn.addEventListener('click', () => {
            state.screen = 'start';
            render();
        });
    }
}

// Initial render
render();

</script>
</body>
</html>
